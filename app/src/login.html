<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../style/login.css">
    <title>Pagina de Bienvenida</title>
    
</head>

<body>
    <main class="container">
        <div class="welcome-card" role="region" aria-labelledby="bienvenido">
            <h1 id="bienvenido">Bienvenido</h1>
            <p class="subtitle">Una app de administracion al estilo Kanban</p>

            <div class="actions">
                <button id="openLogin" class="primary" type="button">Iniciar sesion</button>
                <button id="openRegister" class="secondary" type="button">Registrarse</button>
            </div>

            </p>
        </div>
    </main>


    <div id="loginOverlay" class="overlay">
        <div class="modal">
            <header>
                <h2 id="loginTitle">Iniciar sesion</h2>
                <button class="close-btn" data-close="loginOverlay" aria-label="Cerrar">&times;</button>
            </header>

            <form id="loginForm" novalidate>
                <div class="form-row">
                    <label for="loginNombre">Nombre de Usuario</label>
                    <input id="loginNombre" name="nombreUsuario" type="text"
                        placeholder="Escribe tu nombre de usuario" />
                </div>

                <div class="form-row">
                    <label for="loginPass">Contraseña</label>
                    <input id="loginPass" name="contrasena" type="password" placeholder="Contraseña" />
                </div>

                <div id="loginError" class="error" role="alert" style="display:none"></div>

                <div class="form-actions">
                    <button type="button" class="secondary" data-close="loginOverlay">Cancelar</button>
                    <button type="submit" class="primary">Entrar</button>
                </div>
            </form>
        </div>
    </div>


    <div id="registerOverlay" class="overlay">
        <div class="modal">
            <header>
                <h2 id="registerTitle">Registrarse</h2>
                <button class="close-btn" data-close="registerOverlay" aria-label="Cerrar">&times;</button>
            </header>

            <form id="registerForm" novalidate>
                <div class="form-row">
                    <label for="regNombre">Nombre de Usuario</label>
                    <input id="regNombre" name="nombreUsuario" type="text" placeholder="Nombre de usuario" required />
                </div>

                <div class="form-row">
                    <label for="regCorreo">Correo</label>
                    <input id="regCorreo" name="correo" type="email" placeholder="nrufino@uvigo.gal" required />
                </div>

                <div class="form-row">
                    <label for="regPass">Contraseña</label>
                    <input id="regPass" name="contrasena" type="password" placeholder="Contraseña" required
                        minlength="6" />
                </div>

                <div id="regError" class="error" role="alert" style="display:none"></div>

                <div class="form-actions">
                    <button type="button" class="secondary" data-close="registerOverlay">Cancelar</button>
                    <button type="submit" class="primary">Crear cuenta</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <div><strong>Informacion:</strong> Proyecto Trabajo-TSW — Interfaz de Ejemplo.</div>
        <div class="small">Contacto: equipo@example.com · Version 1.0</div>
    </footer>
    <script type="text/javascript" src="./js/login_script.js"></script>
</body>

</html>
