<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../style/project.css">
    <title>Proyecto</title>


</head>

<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="project-title" id="projName">Proyecto</div>
                <div class="stats-container">
                    <div class="stat-item">
                        <span id="participantsCount">0</span>
                        <button class="btn-link" id="openUserModal">Participantes</button>
                    </div>
                    <div class="stat-item">
                        <span id="totalTasks">0</span>
                        <span class="stat-label">Tareas Totales</span>
                    </div>
                    <div class="stat-item">
                        <span id="completionRate">0%</span>
                        <span class="stat-label">Completado</span>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="btn primary" onclick="goBack()">Volver</button>
            </div>
        </div>
    </header>

    <main class="project-content">
        <div class="tasks-container">
            <div class="cols">
                <div class="col">
                    <h4>ToDo</h4>
                    <div id="col-todo"></div>
                </div>
                <div class="col">
                    <h4>Working</h4>
                    <div id="col-working"></div>
                </div>
                <div class="col">
                    <h4>Done</h4>
                    <div id="col-done"></div>
                </div>
            </div>
        </div>
        <div class="task-actions">
            <button class="btn primary action-btn" id="openTaskModal">+ Nueva Tarea</button>
            <button class="btn action-btn" id="editProjBtn" style="margin-top:12px">Editar Proyecto</button>
            <button class="btn danger action-btn" id="deleteProjBtn" style="margin-top:8px">Eliminar Proyecto</button>
        </div>
    </main>

    <!-- Modales para añadir/editar tarea y administrar usuarios -->
    <div id="taskModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-box">
            <div class="modal-content">
                <h3 id="taskModalTitle">Añadir Tarea</h3>
                <div class="form-row">
                    <label>Nombre</label>
                    <input id="modalTaskName" type="text" required>
                </div>
                <div class="form-row">
                    <label>Descripcion</label>
                    <textarea id="modalTaskDesc" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <label>Estado</label>
                    <select id="modalTaskStatus">
                        <option value="todo">ToDo</option>
                        <option value="working">Working</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>Asignar a</label>
                    <div id="modalTaskAssignees" class="checkbox-list"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="cancelTaskBtn">Cancelar</button>
                <button class="btn primary" id="saveTaskBtn">Guardar</button>
                <input type="hidden" id="editingTaskId" value="">
            </div>
        </div>
    </div>

    <div id="userModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-box">
            <div class="modal-content">
                <h3>Administrar Usuarios</h3>
                <div class="form-row">
                    <label>Usuarios Existentes</label>
                    <div id="modalUserList" class="checkbox-list"></div>
                </div>
                <div class="form-row">
                    <label>Añadir Nuevo Usuario</label>
                    <input id="modalNewUser" type="text" placeholder="Nombre de usuario">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="cancelUserBtn">Cancelar</button>
                <button class="btn primary" id="saveUserBtn">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <div id="editProjectModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-box">
            <div class="modal-content">
                <h3>Editar Proyecto</h3>
                <div class="form-row">
                    <label>Nombre del Proyecto</label>
                    <input id="editProjectName" type="text" required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('editProjectModal')">Cancelar</button>
                <button class="btn primary" id="confirmEditProjectBtn">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <div id="deleteProjectModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-box">
            <div class="modal-content">
                <h3>Eliminar Proyecto</h3>
                <!--El stype al css-->
                <p style="margin:0 0 20px;line-height:1.5">¿Estás seguro de que deseas eliminar este proyecto? Esta
                    acción no se puede deshacer y se perderán todas las tareas asociadas.</p>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('deleteProjectModal')">Cancelar</button>
                <button class="btn danger" id="confirmDeleteProjectBtn">Eliminar proyecto</button>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="./js/project.js"></script>

</body>

</html>
